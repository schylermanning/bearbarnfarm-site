<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bear Barn Farm</title>
  <meta name="description" content="A small family shop in Indiana making Frame TV art and printable wall art.">
  <link rel="icon" href="/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&amp;family=Source+Sans+3:wght@400;600&amp;display=swap">
  <style>
    :root { color-scheme: light dark; --bg: #fbf8f3; --text: #2c241c; --muted: #6b5d4f; --accent: #8a5a2b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1915; --text: #ece4d8; --muted: #b3a593; --accent: #d49a5c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 1.0625rem/1.6 "Source Sans 3", system-ui, sans-serif; }
    main, footer { max-width: 40rem; margin: 0 auto; padding: 0 16px; }
    h1, h2 { font-family: Bitter, Georgia, serif; line-height: 1.2; text-wrap: balance; }
    h1 { font-weight: 700; font-size: 2rem; }
    h2 { font-weight: 600; font-size: 1.25rem; color: var(--accent); margin: 2rem 0 .5rem; }
    a { color: var(--accent); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    footer { font-size: .9rem; color: var(--muted); }
    main { text-align: center; padding-top: 4rem; }
    .logo { display: block; width: 100%; max-width: 280px; height: auto; margin: 0 auto 1.5rem; border-radius: 16px; }
    h1 { margin: 0 0 .5rem; }
    .button { display: inline-block; margin-top: 1rem; padding: .75rem 1.5rem; border-radius: 8px; background: var(--accent); color: var(--bg); font-weight: 600; text-decoration: none; }
    footer { text-align: center; padding-top: 4rem; padding-bottom: 2rem; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="/logo.jpg" alt="Bear Barn Farm logo">
    <h1>Bear Barn Farm</h1>
    <p>A small family shop in Indiana making Frame TV art and printable wall art.</p>
    <a class="button" href="https://www.etsy.com/shop/BearBarnFarm">Visit our Etsy shop</a>
    <h2>Their name, painted into the picture</h2>
    <p>Personalized birthday Frame TV art with your child's name and age on the sign. <a href="/personalized/">See how it works</a></p>
    <p><a href="/gallery/">Browse all our designs</a></p>
  </main>
  <footer><a href="/privacy/">Privacy policy</a></footer>
</body>
</html>
